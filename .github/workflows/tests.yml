name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      # The satellite tier proper — splicewire/laravel-satellite, laravel-connector and
      # laravel-grounding-spine — is PRIVATE, and so is splicewire/laravel-beam-docs, which the beam
      # starter installs too (so it mints the same token). The rest clone anonymously, which is why
      # this workflow got as far as "Syncing splicewire/laravel-grounding-spine into cache" before
      # dying on "Password authentication is not supported". Same App and same two steps deploy.yml
      # already uses in this repo.
      #
      # ⚠️ Fork pull requests get no org secret, so the mint fails there and the run stays red —
      # it was already red at `composer install` for the same reason, one step later.
      - name: Mint a GitHub App installation token (private family repos)
        id: gh-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # `owner` is load-bearing and easy to leave off: without it the action logs "Inputs
          # 'owner' and 'repositories' are not set. Creating token for this repository" and mints a
          # token scoped to the STARTER alone — which authenticates, so the clone fails with
          # "Invalid username or token" rather than anything naming the scope. The packages being
          # cloned are siblings in the same org, so the token has to be org-wide.
          owner: ${{ github.repository_owner }}

      - name: Configure git to use the installation token
        run: git config --global url."https://x-access-token:${{ steps.gh-app.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Enable pnpm
        # `composer setup` step 6 is `pnpm install`, and the ubuntu runner image ships npm and yarn
        # only. corepack reads package.json's `packageManager` pin, so CI and a developer's machine
        # resolve the SAME pnpm — an unpinned corepack pulls latest, which has already broken
        # `pnpm.overrides` once (prove-the-beam-starter 09).
        run: corepack enable && pnpm --version

      - name: Setup Application
        run: composer setup

      # A starter's promise is that `composer setup` from a fresh clone leaves a CLEAN tree: everything
      # it publishes or generates is either tracked or ignored, so anything left over is real signal.
      # That was proven by hand once, and within days new untracked output reappeared unnoticed — a
      # promise nobody checks is not being kept. This records the tree instead of failing on the spot,
      # so a stray file cannot also cost the test suite's signal; the job fails at the end.
      - name: Record what setup left behind
        id: setup-tree
        run: git status --porcelain --untracked-files=all > "$RUNNER_TEMP/setup-tree.txt"

      - name: Run CI Checks
        run: composer ci:check

      # `always()` so a failing ci:check still reports a dirty tree too; the outcome guard so a setup
      # that never finished cannot produce a misleading "dirty tree" failure on top of its real one.
      # This step, not SchemaArtifactDriftTest, fails CI on stale or missing committed schema projections:
      # setup regenerates resources/schemas before ci:check, so the test sees a freshly generated tree here.
      - name: Setup must leave a clean tree
        if: always() && steps.setup-tree.outcome == 'success'
        run: |
          if [ -s "$RUNNER_TEMP/setup-tree.txt" ]; then
            echo "::error::composer setup left files that are neither tracked nor ignored, or modified tracked files."
            echo "Commit what setup legitimately produces, ignore what it should not, or fix the step that wrote it:"
            cat "$RUNNER_TEMP/setup-tree.txt"
            exit 1
          fi
          echo "setup left a clean tree"
