name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      # Three of the 38 git-resolved packages in composer.lock are PRIVATE —
      # splicewire/laravel-satellite, laravel-connector and laravel-grounding-spine, the satellite
      # tier proper. The other 35 clone anonymously, which is why this workflow got as far as
      # "Syncing splicewire/laravel-grounding-spine into cache" before dying on
      # "Password authentication is not supported". Same App and same two steps deploy.yml already
      # uses in this repo; beam's starter needs neither, its family being public by choice.
      #
      # ⚠️ Fork pull requests get no org secret, so the mint fails there and the run stays red —
      # it was already red at `composer install` for the same reason, one step later.
      - name: Mint a GitHub App installation token (satellite-family private repos)
        id: gh-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # `owner` is load-bearing and easy to leave off: without it the action logs "Inputs
          # 'owner' and 'repositories' are not set. Creating token for this repository" and mints a
          # token scoped to the STARTER alone — which authenticates, so the clone fails with
          # "Invalid username or token" rather than anything naming the scope. The packages being
          # cloned are siblings in the same org, so the token has to be org-wide.
          owner: ${{ github.repository_owner }}

      - name: Configure git to use the installation token
        run: git config --global url."https://x-access-token:${{ steps.gh-app.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Enable pnpm
        # `composer setup` step 6 is `pnpm install`, and the ubuntu runner image ships npm and yarn
        # only. corepack reads package.json's `packageManager` pin, so CI and a developer's machine
        # resolve the SAME pnpm — an unpinned corepack pulls latest, which has already broken
        # `pnpm.overrides` once (prove-the-beam-starter 09).
        run: corepack enable && pnpm --version

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
