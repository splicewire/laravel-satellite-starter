# beam-ux content nav (the DATA `splicewire:beam:ux:seed-nav` seeds).
#
# The app provides only this data; the machinery is package-native (NavSource →
# ux:seed-nav → per-realm sitemaps). slug ⇒ {segment, title, type, realm}.
# The realm splits the nav:
#   - site     PUBLIC  — projected to everyone via <SiteNav>.
#   - account  AUTHED  — its own sitemap, signed-in only.
#   - operator STAFF   — its own sitemap, staff-gated.

home:
  segment: /
  title: Home
  type: page
  realm: site

about:
  segment: /about
  title: About
  type: page
  realm: site

dashboard:
  segment: /dashboard
  title: Dashboard
  type: page
  realm: account

settings-profile:
  segment: /settings/profile
  title: Profile
  type: page
  realm: account

# The account-realm settings surfaces. These rows ARE the navigation for them — the packaged
# SettingsLayout's sub-nav is a hardcoded Profile/Security/Appearance list inside
# @splicewire/beam-inertia, and the tenant frame console's nav projects only the sections a package
# seats (`authoring`, `ops`), so before these two lines every route reaching the token and team
# surfaces was URL-only. Adding a row here is the whole of seating one.
account-tokens:
  segment: /account/tokens
  title: API tokens
  type: page
  realm: account

account-team:
  segment: /account/team
  title: Team
  type: page
  realm: account

operator-dashboard:
  segment: /operator
  title: Operator
  type: page
  realm: operator

# The satellite half of the RFC 8628 pairing with a tower, as an operator-realm screen rather than
# only `php artisan splicewire:connect`. Operator realm because pairing writes a platform credential
# into this site's `.env` — the route and every one of its four operations are gated on the same
# `os.operate` entitlement this realm is.
operator-platform-connection:
  segment: /operator/platform-connection
  title: Platform connection
  type: page
  realm: operator
