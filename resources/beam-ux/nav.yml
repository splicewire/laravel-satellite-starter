# beam-ux content nav (the DATA `splicewire:beam:ux:seed-nav` seeds).
#
# The app provides only this data; the machinery is package-native (NavSource →
# ux:seed-nav → per-realm sitemaps). slug ⇒ {segment, title, type, realm}.
# The realm splits the nav:
#   - site     PUBLIC  — projected to everyone via <SiteNav>.
#   - account  AUTHED  — its own sitemap, signed-in only.
#   - operator STAFF   — its own sitemap, staff-gated.

home:
  segment: /
  title: Home
  type: page
  realm: site

about:
  segment: /about
  title: About
  type: page
  realm: site

dashboard:
  segment: /dashboard
  title: Dashboard
  type: page
  realm: account

settings-profile:
  segment: /settings/profile
  title: Profile
  type: page
  realm: account

# The account-realm settings surfaces. These rows ARE the navigation for them — the packaged
# SettingsLayout's sub-nav is a hardcoded Profile/Security/Appearance list inside
# @splicewire/beam-inertia, and the tenant frame console's nav projects only the sections a package
# seats (`authoring`, `ops`), so before these two lines every route reaching the token and team
# surfaces was URL-only. Adding a row here is the whole of seating one.
account-tokens:
  segment: /account/tokens
  title: API tokens
  type: page
  realm: account

account-team:
  segment: /account/team
  title: Team
  type: page
  realm: account

# The THEME editor's door (G2-BEAM-THEME-NAV). The page it leads to is gated on `can:ux.author` and
# its two operations declare `ability: 'ux.author'`, so a member who follows this seat is refused at
# the door — the same shape `tenant-console` below already has, and hiding a seat per ABILITY (as
# opposed to per realm ENTITLEMENT, which HandleInertiaRequests::withoutUnentitledRealmSeats() already
# does) is machinery this host does not have yet.
account-theme:
  segment: /account/theme
  title: Theme
  type: page
  realm: account

operator-dashboard:
  segment: /operator
  title: Operator
  type: page
  realm: operator

# The tenant frame console (the `{frameRoute}` catch-all in routes/web.php) projects every tenant
# resource the packages register, but no realm row ever pointed at it, so it was reachable only by
# URL (ux-demo-convergence inventory anomaly 6, G3-BEAM-FRAME-CONSOLE). Its entries list is the
# console's front door; the console's own rail takes over from there.
tenant-console:
  segment: /beam-ux-entry
  title: Console
  type: page
  realm: account

# The operator realm's DOOR. `operator-dashboard` above declares the seat in `realm: operator`, and
# `ux:seed-nav` seeds it into the operator sitemap — which nothing at this host projects. Measured on
# fresh-tower.test 2026-09-11 as an os.operate holder, the signed-in shell offered exactly Dashboard,
# Profile, API tokens and Team, so the realm was reachable only by typing its URL.
#
# The signed-in chrome is <AccountShell>, which renders the ACCOUNT realm's rail, so this is the realm
# a door has to be seated in. HandleInertiaRequests::withoutUnentitledRealmSeats() drops it again for a
# principal without the realm's declared entitlement, so the seat and `can:entitlement:os.operate` on
# the route read one declaration (`beam.core.realm_gates`) and cannot disagree.
operator-seat:
  segment: /operator
  title: Operator
  type: page
  realm: account

# The satellite half of the RFC 8628 pairing with a tower, as an operator-realm screen rather than
# only `php artisan splicewire:connect`. Operator realm because pairing writes a platform credential
# into this site's `.env` — the route and every one of its four operations are gated on the same
# `os.operate` entitlement this realm is.
#
# `icon` is read by the operator rail seat (App\Beam\OperatorRailSeat) and resolved by
# @splicewire/beam-inertia's icon map; without it the row renders a neutral dot. ux:seed-nav ignores it.
operator-platform-connection:
  segment: /operator/platform-connection
  title: Platform connection
  type: page
  realm: operator
  icon: link
